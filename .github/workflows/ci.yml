name: CI

# Runs on every push to any branch and on every pull request, so a branch is
# checked before a PR exists. Also runnable by hand from the Actions tab.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dfk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d dfk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      # PostgreSQL-backed tests are mandatory here. If this is missing or the
      # database is unreachable, the run FAILS instead of skipping them.
      REQUIRE_DB_TESTS: "1"
      # Throwaway database that only exists for this job. Not a real credential.
      TEST_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/dfk_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database is reachable
        run: |
          node -e "
          const { Client } = require('pg');
          const c = new Client({ connectionString: process.env.TEST_DATABASE_URL });
          c.connect().then(() => c.query('select version()')).then(r => { console.log(r.rows[0].version); return c.end(); })
            .catch(e => { console.error('CI database is NOT reachable:', e.message); process.exit(1); });
          "
      - run: npm run lint
      - run: npm run typecheck
      # Vitest with a JSON report; the gate then fails on ANY skipped, todo or failed test.
      - run: npm run test:ci
      - run: npm run build
      # Production dependencies must be clean; only the documented dev-tool advisories may remain.
      - run: npm run audit:gate
