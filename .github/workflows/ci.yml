name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dfk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d dfk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway database that only exists for this job.
      TEST_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/dfk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Production dependencies must be clean. Dev-only advisories are reported in the README.
      - run: npm audit --omit=dev --audit-level=high
